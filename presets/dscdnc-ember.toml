# dscdnc layout in smouldering reds and amber.
format = """
[](orange)\
$os[](fg:orange bg:yellow)\
$directory[](fg:yellow bg:magenta)\
$git_branch$git_status[](fg:magenta bg:violet)\
[](fg:violet bg:dark)\
[](fg:dark) \
$character"""

palette = "dscdnc-ember"

[palettes.dscdnc-ember]
ink = "#ffb000"
dark = "#ffd000"
magenta = "#d84315"
yellow = "#b3261e"
violet = "#2a1a14"
orange = "#1c1010"
cream = "#fff4e0"

[os]
disabled = false
style = "bg:orange fg:ink"
format = "[ $symbol ]($style)"

[directory]
style = "bg:yellow fg:ink"
format = "[  $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = ""
format = "[[ $symbol $branch ](fg:cream bg:magenta)](bg:magenta)"

[git_status]
format = "[[ $all_status$ahead_behind ](fg:cream bg:magenta)](bg:magenta)"

[nodejs]
symbol = "(nd)"
format = "[[ $symbol $version ](fg:cream bg:violet)](bg:violet)"

[rust]
symbol = ""
format = "[[ $symbol $version ](fg:cream bg:violet)](bg:violet)"

[python]
symbol = ""
format = "[[ $symbol $version ](fg:cream bg:violet)](bg:violet)"

[time]
disabled = true
time_format = "%H:%M"
format = "[[  $time ](fg:cream bg:dark)](bg:dark)"

[character]
success_symbol = "[➜](bold fg:yellow)"
error_symbol = "[➜](bold fg:orange)"
