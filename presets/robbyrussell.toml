
# Port of the oh-my-zsh default theme:  \u279c  dir git:(branch) \u2717

add_newline = false

format = "$character$directory$git_branch$git_status"

[character]
success_symbol = "[\u279c](bold green)"
error_symbol = "[\u279c](bold red)"
vicmd_symbol = "[\u279c](bold green)"
format = "$symbol "

[directory]
style = "cyan"
format = "[$path]($style) "
truncation_length = 1
truncation_symbol = ""
truncate_to_repo = false

[git_branch]
symbol = ""
format = "[git:\\(](bold blue)[$branch](red)[\\)](bold blue)"

[git_status]
format = " [\u2717](yellow)"
