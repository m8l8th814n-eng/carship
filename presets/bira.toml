
# Port of the oh-my-zsh bira theme: two lines, bracketed segments.

format = """
[\u250c\u2500](bold blue)[$username@$hostname](bold)[ $directory](bold)$git_branch$git_status$python$nodejs$rust
[\u2514\u2500](bold blue)$character"""

[username]
show_always = true
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold cyan"
format = "[$hostname]($style)"

[directory]
style = "bold yellow"
format = "[$path]($style)"
truncate_to_repo = false
truncation_length = 0

[git_branch]
symbol = ""
style = "white"
format = " [git:\\(](bold blue)[$branch](bold red)[\\)](bold blue)"

[git_status]
style = "bold yellow"
format = "[\u2717]($style)"

[python]
format = " [\\($version\\)]($style)"
style = "bold blue"

[nodejs]
format = " [\\($version\\)]($style)"
style = "bold green"

[rust]
format = " [\\($version\\)]($style)"
style = "bold red"

[character]
success_symbol = "[\u276f](bold green)"
error_symbol = "[\u276f](bold red)"
vicmd_symbol = "[\u276e](bold green)"
format = "$symbol "
