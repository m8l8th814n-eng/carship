# animated — the animation module, and as little else as possible.
#
# The frame index comes from the clock rather than from any shared state, so
# every process that renders the prompt picks the same frame. Nothing redraws
# an idle prompt on its own, though: set CARSHIP_ANIMATE to the number of
# seconds between redraws before loading carship, or the spinner only advances
# once per command.
#
#     export CARSHIP_ANIMATE=1
#     eval "$(carship init zsh)"
#
# frames is left at its default braille spinner. styles is a parallel list, so
# the colour can cycle at its own pace and turn the spinner into a gradient.

add_newline = false

format = "$animation$directory$git_branch$git_status$character"

[animation]
disabled = false
interval = 120
styles = [
  "cyan", "cyan", "blue", "blue", "purple",
  "purple", "blue", "blue", "cyan", "cyan",
]
format = "[$frame ]($frame_style)"

[directory]
style = "bold blue"
format = "[$path]($style) "
truncate_to_repo = false
truncation_length = 3
truncation_symbol = "\u2026/"

[git_branch]
symbol = ""
style = "purple"
format = "[$branch]($style) "

[git_status]
style = "yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "~"
ahead = "\u2191${count}"
behind = "\u2193${count}"
diverged = "\u2195"
untracked = "?${count}"
stashed = "*"
modified = "!${count}"
staged = "+${count}"
renamed = "\u00bb${count}"
deleted = "-${count}"

[character]
success_symbol = "[\u276f](green)"
error_symbol = "[\u276f](red)"
vicmd_symbol = "[\u276e](green)"
format = "$symbol "
